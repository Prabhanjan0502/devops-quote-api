---
- name: Install Java runtime
  ansible.builtin.apt:
    name: openjdk-17-jre-headless
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy application JAR
  ansible.builtin.copy:
    src: "{{ jar_src }}"
    dest: "{{ app_dir }}/{{ jar_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart quote-api

- name: Install systemd service unit
  ansible.builtin.template:
    src: quote-api.service.j2
    dest: /etc/systemd/system/quote-api.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart quote-api

- name: Run pending handlers before starting the service
  ansible.builtin.meta: flush_handlers

- name: Enable and start the service
  ansible.builtin.systemd:
    name: quote-api
    enabled: true
    state: started

- name: Wait for the application port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    delay: 3
    timeout: 90

- name: Check the health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    return_content: true
  register: health

- name: Show health response
  ansible.builtin.debug:
    msg: "Health check returned {{ health.content }}"
